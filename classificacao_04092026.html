<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Classificação — Arena Futsal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,700;0,800;1,600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --cor-fundo: #050c1c;
    --cor-fundo2: #0a1638;
    --cor-amarelo: #ffbf00;
    --cor-branco: #ffffff;
    --cor-verde: #22c55e;
    --cor-vermelho: #dc2626;
    --cor-cinza: #8c96a5;
    --escala: 1; /* recalculado via JS = largura real do #card / 1536 */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: 'Poppins', sans-serif; color: var(--cor-branco);
  }
  body.fundo-solido { background: #0a1020; }
  #baixar-btn {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 999;
    padding: 8px 20px; background: var(--cor-amarelo); color: #0a0f1f; border: none;
    border-radius: 8px; font-family: 'Poppins', sans-serif; font-weight: 800; cursor: pointer;
  }
  body.modo-overlay #baixar-btn { display: none; }

  #card {
    position: relative;
    width: min(100vw, 1536px);
    background: linear-gradient(160deg, var(--cor-fundo) 0%, var(--cor-fundo2) 100%);
    border: calc(2px * var(--escala)) solid var(--cor-amarelo);
    border-radius: calc(14px * var(--escala));
    overflow: hidden;
    padding: calc(20px * var(--escala)) calc(26px * var(--escala)) calc(16px * var(--escala));
    transform-origin: top center;
    margin: 0 auto;
  }

  #cabecalho {
    display: flex; align-items: center; justify-content: center; position: relative;
    padding-bottom: calc(12px * var(--escala));

  #tabela tbody td {

  #tabela tbody td.time { text-align: left; padding-left: calc(10px * var(--escala)); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 0; }
  #tabela tbody td.time .escudo {

  #tabela tbody tr td:first-child { border-top-left-radius: calc(8px * var(--escala)); border-bottom-left-radius: calc(8px * var(--escala)); }
  #tabela tbody tr td:last-child { border-top-right-radius: calc(8px * var(--escala)); border-bottom-right-radius: calc(8px * var(--escala)); }

  .var-bloco { display: inline-flex; align-items: center; gap: calc(4px * var(--escala)); font-weight: 800; }
  .var-tri { width: 0; height: 0; border-left: calc(6px * var(--escala)) solid transparent; border-right: calc(6px * var(--escala)) solid transparent; }

  #rodape {

    margin-top: calc(12px * var(--escala)); padding-top: calc(10px * var(--escala));

  }
  #rodape img { height: calc(56px * var(--escala)); width: auto; object-fit: contain; display: none; }

  #vazio { text-align: center; padding: 40px; color: var(--cor-cinza); font-style: italic; }
</style>

      <span class="sep" id="sep-fase" style="display:none;">•</span>
      <span class="valor" id="valor-fase" style="display:none;"></span>

  </div>
</div>
<button id="baixar-btn" onclick="baixarComoImagem()">⬇ Baixar como imagem</button>

<script>
const SUPABASE_URL = "https://tijoqfkjabapbanpsuqd.supabase.co";
const SUPABASE_KEY = "sb_publishable_4Cl2yym3lTvWWh1A-mRIFQ_Uk3B5vgP";
const LOGOS_BUCKET = "logos";

let _cacheListaLogosTimes = null;

function normalizarNomeArquivo(txt) {
  return txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

async function listarLogosTimes() {
  if (_cacheListaLogosTimes !== null) return _cacheListaLogosTimes;
  try {
    const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${LOGOS_BUCKET}`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: "times/", limit: 1000 }),
    });
    if (!resp.ok) throw new Error(`list falhou (${resp.status})`);
    const dados = await resp.json();
    _cacheListaLogosTimes = dados.map((f) => f.name).filter((n) => n && !n.endsWith("/"));
  } catch (e) {
    console.error("Não consegui listar logos de times:", e);
    _cacheListaLogosTimes = [];
  }
  return _cacheListaLogosTimes;
}

async function logoTimeUrlPorNome(nomeTime) {
  const arquivos = await listarLogosTimes();
  const nomeNorm = normalizarNomeArquivo(nomeTime);
  for (const arq of arquivos) {
    const semExt = arq.replace(/\.[^/.]+$/, "");
    const arqNorm = normalizarNomeArquivo(semExt);
    if (arqNorm.startsWith(nomeNorm) || nomeNorm.startsWith(arqNorm)) {
      return `${SUPABASE_URL}/storage/v1/object/public/${LOGOS_BUCKET}/times/${arq}`;
    }
  }
  return null;
}

const params = new URLSearchParams(location.search);
const COMPETICOES = (params.get("competicoes") || "").split(",").map(s => s.trim()).filter(Boolean);
const CATEGORIA_FILTRO = (params.get("categoria") || "").trim().toUpperCase();
const DATA_INICIO = params.get("data_inicio") || "";
const DATA_FIM = params.get("data_fim") || ""; // não usada mais no cálculo — mantida só pra não quebrar links antigos que já têm esse parâmetro
const TORNEIO_PARAM = params.get("torneio") || "";
const DIVISAO_PARAM = params.get("divisao") || "";
const REFRESH_SEGUNDOS = Number(params.get("refresh") || 0);
const LOGO_TRANSMISSAO = params.get("transmissao") || "";
if (params.get("fundo") === "solido") document.body.classList.add("fundo-solido");
if (params.get("modo") === "overlay") document.body.classList.add("modo-overlay");

function aplicarEscala() {
  const card = document.getElementById("card");
  const escala = card.clientWidth / 1536;
  document.documentElement.style.setProperty("--escala", escala);
}

function ajustarParaCaberNaTela() {
  const card = document.getElementById("card");
  card.style.transform = "none"; // mede sem encolher antes, senão a medida vem errada
  const alturaNecessaria = card.getBoundingClientRect().height;
  const alturaDisponivel = window.innerHeight;
  if (alturaNecessaria > alturaDisponivel) {
    const fator = Math.max(alturaDisponivel / alturaNecessaria, 0.4);
    card.style.transform = `scale(${fator})`;
  }
}

async function fetchJSON(url) {
  const resp = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!resp.ok) throw new Error(`Falha ao buscar ${url} (${resp.status})`);
  return resp.json();
}

async function fetchJogos() {
  if (COMPETICOES.length === 0) return [];
  const filtroComp = `competicao_id=in.(${COMPETICOES.join(",")})`;
  return fetchJSON(
    `${SUPABASE_URL}/rest/v1/jogos?select=data,gols_mandante,gols_visitante,time_mandante_id,time_visitante_id,competicao_id,competicoes(categoria)` +
    `&${filtroComp}&status=eq.FINALIZADO&fase=eq.Grupos&order=data.asc&limit=2000`
  );
}

// Busca TODOS os jogos (qualquer status: finalizado, agendado, em andamento)
// só pra descobrir a lista completa de times cadastrados na competição —
// time que ainda não jogou nenhuma partida finalizada não aparece na busca
// de cima, mas ainda assim precisa aparecer na tabela (com 0 pontos).
// Só fase de Grupos, mesma razão de fetchJogos() — mata-mata não deve
// influenciar essa tabela (mesmo que só pra listar nomes de times, já
// que todo time que chega ao mata-mata necessariamente jogou os grupos).
async function fetchTodosOsTimesIds() {
  if (COMPETICOES.length === 0) return [];
  const filtroComp = `competicao_id=in.(${COMPETICOES.join(",")})`;
  const rows = await fetchJSON(
    `${SUPABASE_URL}/rest/v1/jogos?select=time_mandante_id,time_visitante_id,competicoes(categoria)` +
    `&${filtroComp}&fase=eq.Grupos&limit=2000`
  );
  const filtradas = CATEGORIA_FILTRO
    ? rows.filter((j) => (j.competicoes?.categoria || "").trim().toUpperCase() === CATEGORIA_FILTRO)
    : rows;
  return [...new Set(filtradas.flatMap((j) => [j.time_mandante_id, j.time_visitante_id]).filter(Boolean))];
}

async function fetchTimesNomes(ids) {
  if (ids.length === 0) return {};
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/times?select=id,nome_app&id=in.(${ids.join(",")})`);
  const mapa = {};
  rows.forEach((r) => (mapa[r.id] = r.nome_app));
  return mapa;
}

/** Calcula a classificação (posição, pontos, jogos, V/E/D, saldo) a partir
 * de uma lista de jogos já filtrada. Critério de desempate igual ao resto
 * do app: pontos → vitórias → saldo de gols → gols pró.
 * `todosOsNomes` (opcional): nomes de TODOS os times cadastrados na
 * competição, mesmo os que ainda não jogaram nenhuma partida finalizada —
 * garante que apareçam na tabela com 0 pontos, em vez de sumir. */
function calcularTabela(jogos, nomes, todosOsNomes = []) {
  const dados = {};
  for (const nome of todosOsNomes) {
    if (nome) dados[nome] = { pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 };
  }
  for (const j of jogos) {
    const m = nomes[j.time_mandante_id];
    const v = nomes[j.time_visitante_id];
    const gm = j.gols_mandante, gv = j.gols_visitante;
    if (gm == null || gv == null || !m || !v) continue;
    for (const t of [m, v]) {
      if (!dados[t]) dados[t] = { pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gp: 0, gc: 0 };
    }
    dados[m].jogos++; dados[v].jogos++;
    dados[m].gp += gm; dados[m].gc += gv;
    dados[v].gp += gv; dados[v].gc += gm;
    if (gm > gv) { dados[m].pontos += 3; dados[m].vitorias++; dados[v].derrotas++; }
    else if (gv > gm) { dados[v].pontos += 3; dados[v].vitorias++; dados[m].derrotas++; }
    else { dados[m].pontos += 1; dados[v].pontos += 1; dados[m].empates++; dados[v].empates++; }
  }
  const times = Object.keys(dados).map((t) => ({
    time: t, ...dados[t], saldo: dados[t].gp - dados[t].gc,
  }));
  times.sort((a, b) =>
    b.pontos - a.pontos || b.vitorias - a.vitorias || b.saldo - a.saldo || b.gp - a.gp
  );
  const posicoes = {};
  times.forEach((t, i) => (posicoes[t.time] = i + 1));
  return { times, posicoes };
}

function montarLinhaVar(variacao) {
  if (!variacao) return `<span class="var-zero">–</span>`;
  if (variacao > 0) return `<span class="var-bloco"><span class="var-tri var-cima"></span><span>${variacao}</span></span>`;
  return `<span class="var-bloco"><span class="var-tri var-baixo"></span><span>${Math.abs(variacao)}</span></span>`;
}

// ---------------------------------------------------------------------------
// Classificação Geral (Grupos + Mata-Mata) — mesma lógica/critério do
// gerador de Instagram (dados_classificacao.py) e da área "🏆 Mata-Mata"
// do app.py: soma de pontos por fase (V=3/E=1/D=0, só jogos FINALIZADO),
// usada só quando a categoria já tem chaveamento/jogo de mata-mata.
// ---------------------------------------------------------------------------

const FASES_ORDEM = ["Grupos", "Oitavas", "Quartas", "Semifinal", "Final"];

async function fetchFasesBracket(competicaoId) {
  const rows = await fetchJSON(
    `${SUPABASE_URL}/rest/v1/chave_confronto?select=fase&competicao_id=eq.${competicaoId}`
  );
  return [...new Set(rows.map((r) => r.fase).filter(Boolean))];
}

async function resolverCompeticaoIdDaCategoria(idsCompeticoes, categoriaFiltro) {
  if (idsCompeticoes.length === 0 || !categoriaFiltro) return null;
  const rows = await fetchJSON(
    `${SUPABASE_URL}/rest/v1/competicoes?select=id,categoria&id=in.(${idsCompeticoes.join(",")})`
  );
  const achado = rows.find((r) => (r.categoria || "").trim().toUpperCase() === categoriaFiltro);
  return achado ? achado.id : null;
}

async function fetchJogosTodasFases(competicaoId) {
  return fetchJSON(
    `${SUPABASE_URL}/rest/v1/jogos?select=fase,status,gols_mandante,gols_visitante,time_mandante_id,time_visitante_id,vencedor_forcado_id` +
    `&competicao_id=eq.${competicaoId}&limit=2000`
  );
}

function calcularClassificacaoGeral(jogos, nomes, fasesPresentes) {
  const dados = {};
  for (const id of Object.keys(nomes)) {
    const nome = nomes[id];
    if (!dados[nome]) {
      dados[nome] = { time: nome, pontosPorFase: {}, total: 0 };
      fasesPresentes.forEach((f) => (dados[nome].pontosPorFase[f] = 0));
    }
  }
  for (const fase of fasesPresentes) {
    const jogosFase = jogos.filter((j) => j.fase === fase && String(j.status).trim().toUpperCase() === "FINALIZADO");
    for (const j of jogosFase) {
      const m = nomes[j.time_mandante_id];
      const v = nomes[j.time_visitante_id];
      if (!m || !v) continue;

      // W.O. administrativo pós-jogo iniciado: o placar de quadra pode não
      // refletir o vencedor oficial — vencedor_forcado_id manda, igual já
      // faz o sync_probabilidades.py pra classificação normal.
      if (j.vencedor_forcado_id != null) {
        if (j.vencedor_forcado_id == j.time_mandante_id) dados[m].pontosPorFase[fase] += 3;
        else if (j.vencedor_forcado_id == j.time_visitante_id) dados[v].pontosPorFase[fase] += 3;
        continue;
      }

      const gm = j.gols_mandante, gv = j.gols_visitante;
      if (gm == null || gv == null) continue;
      if (gm > gv) dados[m].pontosPorFase[fase] += 3;
      else if (gv > gm) dados[v].pontosPorFase[fase] += 3;
      else { dados[m].pontosPorFase[fase] += 1; dados[v].pontosPorFase[fase] += 1; }
    }
  }
  const times = Object.values(dados).map((t) => {
    t.total = fasesPresentes.reduce((soma, f) => soma + t.pontosPorFase[f], 0);
    return t;
  });
  times.sort((a, b) => b.total - a.total);
  return times;
}

async function montarPagina() {
  aplicarEscala();
  const logoImg = document.getElementById("logo-arena");
  logoImg.src = `${SUPABASE_URL}/storage/v1/object/public/logos/marca/logo_arena_futsal.png`;
  logoImg.style.display = "inline-block";

  if (LOGO_TRANSMISSAO) {
    const logoTransmissaoImg = document.getElementById("logo-transmissao");
    logoTransmissaoImg.src = `${SUPABASE_URL}/storage/v1/object/public/logos/transmissao/${LOGO_TRANSMISSAO}`;
    logoTransmissaoImg.style.display = "inline-block";
  }

  document.getElementById("valor-torneio").textContent = TORNEIO_PARAM.toUpperCase() || "—";
  document.getElementById("valor-divisao").textContent = DIVISAO_PARAM.toUpperCase() || "—";
  document.getElementById("valor-categoria").textContent = CATEGORIA_FILTRO || "—";

  try {
    // ---- Categoria específica com mata-mata já em andamento? Usa a
    // Classificação Geral (Grupos + fases), com escudos, no lugar da
    // tabela normal. O link sempre traz TODAS as competições do
    // torneio/divisão em `competicoes` (a categoria só filtra a
    // exibição) — por isso resolve qual delas é a da categoria escolhida
    // antes de decidir o modo. ----
    if (CATEGORIA_FILTRO && COMPETICOES.length >= 1) {
      const competicaoId = await resolverCompeticaoIdDaCategoria(COMPETICOES, CATEGORIA_FILTRO);

      if (competicaoId !== null) {
        const fasesNoBracket = await fetchFasesBracket(competicaoId);
        const jogosTodasFases = await fetchJogosTodasFases(competicaoId);
        const fasesComJogo = [...new Set(jogosTodasFases.map((j) => j.fase).filter(Boolean))];
        const fasesPresentes = FASES_ORDEM.filter(
          (f) => f === "Grupos" || fasesNoBracket.includes(f) || fasesComJogo.includes(f)
        );

        if (fasesPresentes.length > 1) {
          const idsTimes = [...new Set(jogosTodasFases.flatMap((j) => [j.time_mandante_id, j.time_visitante_id]).filter(Boolean))];
          const nomes = await fetchTimesNomes(idsTimes);

          if (idsTimes.length === 0) {
            document.getElementById("corpo-tabela").innerHTML = `<tr><td colspan="${fasesPresentes.length + 2}"><div id="vazio">Nenhum time encontrado nesse recorte</div></td></tr>`;
            return;
          }

          const timesGeral = calcularClassificacaoGeral(jogosTodasFases, nomes, fasesPresentes);
          const logosUrls = await Promise.all(timesGeral.map((t) => logoTimeUrlPorNome(t.time)));

          const faseAtual = fasesPresentes[fasesPresentes.length - 1]; // fase mais avançada já alcançada
          document.getElementById("valor-fase").textContent = `🏆 ${faseAtual.toUpperCase()}`;
          document.getElementById("valor-fase").style.display = "inline";
          document.getElementById("sep-fase").style.display = "inline";
          document.getElementById("valor-fixo-titulo").textContent = "Classificação Geral";

          document.getElementById("linha-cabecalho-tabela").innerHTML =
            `<th>Pos</th><th class="time">Time</th>` +
            fasesPresentes.map((f) => `<th>${f.toUpperCase()}</th>`).join("") +
            `<th>Total</th>`;

          const linhas = timesGeral.map((t, i) => {
            const logoUrl = logosUrls[i];
            const escudoHtml = logoUrl ? `<img class="escudo" src="${logoUrl}" alt="" onerror="this.style.display='none'" />` : "";
            const colunasFase = fasesPresentes.map((f) => `<td>${t.pontosPorFase[f]}</td>`).join("");
            return `
              <tr>
                <td class="pos">${i + 1}</td>
                <td class="time">${escudoHtml}${t.time}</td>
                ${colunasFase}
                <td class="total">${t.total}</td>
              </tr>`;
          }).join("");

          document.getElementById("corpo-tabela").innerHTML = linhas;
          ajustarParaCaberNaTela();
          return;
        }

        // só Grupos -> cai pro fluxo normal abaixo, com o cabeçalho padrão
        document.getElementById("linha-cabecalho-tabela").innerHTML =
          `<th>Pos</th><th class="time">Time</th><th>PG</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th><th>Var</th>`;
      }
    }

    let jogos = await fetchJogos();
    if (CATEGORIA_FILTRO) {
      jogos = jogos.filter((j) => (j.competicoes?.categoria || "").trim().toUpperCase() === CATEGORIA_FILTRO);
    }

    const idsTimesComJogo = jogos.flatMap((j) => [j.time_mandante_id, j.time_visitante_id]);
    const idsTodosOsTimes = await fetchTodosOsTimesIds();
    const idsTimes = [...new Set([...idsTimesComJogo, ...idsTodosOsTimes])];

    if (idsTimes.length === 0) {
      document.getElementById("corpo-tabela").innerHTML = `<tr><td colspan="9"><div id="vazio">Nenhum time encontrado nesse recorte</div></td></tr>`;
      return;
    }

    const nomes = await fetchTimesNomes(idsTimes);
    const todosOsNomes = idsTodosOsTimes.map((id) => nomes[id]).filter(Boolean);

    const soData = (d) => String(d).slice(0, 10); // corta pra AAAA-MM-DD, mesmo se vier com hora junto
    // A tabela ATUAL sempre reflete TODOS os jogos até hoje, nunca travada
    // numa data_fim — senão descasa da classificação real assim que rolar
    // jogo novo depois dessa data. Só o "antes" usa data_inicio como corte.
    const jogosAntes = DATA_INICIO ? jogos.filter((j) => soData(j.data) < DATA_INICIO) : [];

    const { times: tabelaAtual } = calcularTabela(jogos, nomes, todosOsNomes);
    const { posicoes: posicoesAntes } = calcularTabela(jogosAntes, nomes, todosOsNomes);

    const linhas = tabelaAtual.map((t, i) => {
      const pos = i + 1;
      const posAntes = posicoesAntes[t.time];
      const variacao = posAntes !== undefined ? posAntes - pos : 0;
      return `
        <tr>
          <td class="pos">${pos}</td>
          <td class="time">${t.time}</td>
          <td>${t.pontos}</td>
          <td>${t.jogos}</td>
          <td>${t.vitorias}</td>
          <td>${t.empates}</td>
          <td>${t.derrotas}</td>
          <td class="sg">${t.saldo >= 0 ? "+" : ""}${t.saldo}</td>
          <td>${montarLinhaVar(variacao)}</td>
        </tr>`;
    }).join("");

    document.getElementById("corpo-tabela").innerHTML = linhas;
    ajustarParaCaberNaTela();
  } catch (err) {
    console.error(err);
    document.getElementById("corpo-tabela").innerHTML = `<tr><td colspan="9"><div id="vazio">Erro ao carregar: ${err.message}</div></td></tr>`;
  }
}

montarPagina();

  btn.style.display = "none";
  html2canvas(document.getElementById("card"), { backgroundColor: null, scale: 2, useCORS: true }).then((canvas) => {

    link.download = "classificacao.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

window.addEventListener("resize", () => {

});
