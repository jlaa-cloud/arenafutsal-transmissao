<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ticker de Resultados — Arena Futsal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --cor-fundo: #050c1c;
    --cor-amarelo: #ffbf00;
    --cor-branco: #ffffff;
    --cor-verde: #3cc878;
    --cor-cinza: #96a0b4;
    --escala-ticker: 1; /* recalculado via JS = altura real da #faixa / 80px */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: 'Poppins', sans-serif; color: var(--cor-branco);
  }
  body.fundo-solido { background: #0a1020; }

  #faixa {
    position: relative;
    width: 100vw;
    height: 9vh;
    min-height: 56px;
    max-height: 96px;
    background: linear-gradient(90deg, #050c1c 0%, #0a1638 50%, #050c1c 100%);
    border-top: 2px solid var(--cor-amarelo);
    display: flex;
    align-items: center;
    overflow: hidden;
  }

  #rotulo {
    flex: 0 0 auto;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--cor-amarelo);
    color: #0a0f1f;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-size: calc(18px * var(--escala-ticker));
    padding: 0 calc(20px * var(--escala-ticker));
    white-space: nowrap;
    clip-path: polygon(0 0, 100% 0, calc(100% - 18px) 100%, 0 100%);
    z-index: 2;
  }

  #trilho {
    flex: 1 1 auto;
    height: 100%;
    overflow: hidden;
    position: relative;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, black 3%, black 97%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, black 3%, black 97%, transparent 100%);
  }

  #pista {
    display: inline-flex;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    will-change: transform;
    animation: rolar var(--duracao, 40s) linear infinite;
  }
  body.pausado #pista { animation-play-state: paused; }

  @keyframes rolar {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .item {
    display: inline-flex;
    align-items: center;
    gap: clamp(8px, 1vw, 16px);
    padding: 0 clamp(16px, 2vw, 32px);
    height: 100%;
    font-size: calc(17px * var(--escala-ticker));
    font-weight: 600;
  }
  .item .categoria {
    color: var(--cor-branco);
    font-size: calc(15px * var(--escala-ticker));
    font-weight: 800;
    text-transform: uppercase;
    border: 1px solid #4a5670;
    border-radius: 4px;
    padding: 3px 8px;
  }
  .item .time { color: var(--cor-branco); font-weight: 700; }
  .item .placar {
    color: var(--cor-amarelo);
    font-weight: 800;
    font-size: calc(20px * var(--escala-ticker));
    padding: 0 2px;
  }
  .item .ao-vivo {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--cor-verde); font-weight: 800; font-size: calc(11px * var(--escala-ticker));
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .item .ao-vivo .ponto {
    width: 6px; height: 6px; border-radius: 50%; background: var(--cor-verde);
    animation: piscar 1.2s ease-in-out infinite;
  }
  @keyframes piscar { 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  .item .final {
    color: var(--cor-cinza); font-weight: 700; font-size: calc(11px * var(--escala-ticker));
    text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.7;
  }
  #rotulo img {
    height: calc(50px * var(--escala-ticker));
    width: auto;
    object-fit: contain;
    display: none;
  }
  .separador { color: #3a4560; }

  #vazio {
    flex: 1; text-align: center; color: var(--cor-cinza);
    font-size: calc(15px * var(--escala-ticker)); font-style: italic;
  }
</style>
</head>
<body>

<div id="faixa">
  <div id="rotulo">
    <img id="logo-arena" src="" alt="" onerror="this.style.display='none'" />
    RESULTADOS
  </div>
  <div id="trilho"><div id="pista"></div></div>
</div>

<script>
const SUPABASE_URL = "https://tijoqfkjabapbanpsuqd.supabase.co";
const SUPABASE_KEY = "sb_publishable_4Cl2yym3lTvWWh1A-mRIFQ_Uk3B5vgP";

const params = new URLSearchParams(location.search);
const COMPETICOES = (params.get("competicoes") || "").split(",").map(s => s.trim()).filter(Boolean);
const DATA_INICIO = params.get("data_inicio") || "";
const CATEGORIA_FILTRO = (params.get("categoria") || "").trim().toUpperCase();
const DATA_FIM = params.get("data_fim") || "";
const REFRESH_SEGUNDOS = Number(params.get("refresh") || 45);
const VELOCIDADE_PX_S = Number(params.get("velocidade") || 65); // pixels por segundo — ritmo constante
if (params.get("fundo") === "solido") document.body.classList.add("fundo-solido");
if (params.get("pausado") === "1") document.body.classList.add("pausado");

function aplicarVelocidade() {
  const pista = document.getElementById("pista");
  // pista já vem com o conteúdo duplicado (loop sem salto) — uma volta
  // completa percorre metade da largura total renderizada.
  const larguraUmaVolta = pista.scrollWidth / 2;
  const duracaoSegundos = Math.max(larguraUmaVolta / VELOCIDADE_PX_S, 3);
  document.documentElement.style.setProperty("--duracao", `${duracaoSegundos}s`);
}

async function fetchJSON(url) {
  const resp = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!resp.ok) throw new Error(`Falha ao buscar ${url} (${resp.status})`);
  return resp.json();
}

async function fetchJogos() {
  if (COMPETICOES.length === 0) return [];
  const filtroComp = `competicao_id=in.(${COMPETICOES.join(",")})`;
  const filtroData = (DATA_INICIO && DATA_FIM)
    ? `&data=gte.${DATA_INICIO}&data=lte.${DATA_FIM}`
    : "";
  return fetchJSON(
    `${SUPABASE_URL}/rest/v1/jogos?select=gols_mandante,gols_visitante,status,data,horario,time_mandante_id,time_visitante_id,competicao_id,competicoes(categoria)` +
    `&${filtroComp}${filtroData}&status=in.(FINALIZADO,EM%20ANDAMENTO)&order=data.asc,horario.asc&limit=1000`
  );
}

async function fetchTimesNomes(ids) {
  if (ids.length === 0) return {};
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/times?select=id,nome_app&id=in.(${ids.join(",")})`);
  const mapa = {};
  rows.forEach((r) => (mapa[r.id] = r.nome_app));
  return mapa;
}

function montarItemHTML(jogo, nomes) {
  const nomeA = nomes[jogo.time_mandante_id] || "—";
  const nomeB = nomes[jogo.time_visitante_id] || "—";
  const aoVivo = String(jogo.status).trim().toUpperCase() === "EM ANDAMENTO";
  const categoria = (jogo.competicoes?.categoria || "").toString().toUpperCase();

  return `
    <span class="item">
      ${categoria ? `<span class="categoria">${categoria}</span>` : ""}
      <span class="time">${nomeA}</span>
      <span class="placar">${jogo.gols_mandante ?? 0} x ${jogo.gols_visitante ?? 0}</span>
      <span class="time">${nomeB}</span>
      ${aoVivo ? `<span class="ao-vivo"><span class="ponto"></span>Em Andamento</span>` : `<span class="final">Final</span>`}
    </span>
    <span class="separador">●</span>
  `;
}

function aplicarEscalaFaixa() {
  const faixa = document.getElementById("faixa");
  const escala = faixa.clientHeight / 80; // 80px = altura de design de referência
  document.documentElement.style.setProperty("--escala-ticker", escala);
}

function numeroCategoria(jogo) {
  const texto = jogo.competicoes?.categoria || "";
  const match = texto.match(/\d+/); // extrai o número, robusto contra "Sub-7" vs "Sub-10" etc.
  return match ? parseInt(match[0], 10) : 999; // sem número identificável vai pro final
}

async function montarTicker() {
  aplicarEscalaFaixa();
  const logoImg = document.getElementById("logo-arena");
  logoImg.src = `${SUPABASE_URL}/storage/v1/object/public/logos/marca/selo_arena_futsal.png`;
  logoImg.style.display = "inline-block";

  const pista = document.getElementById("pista");
  try {
    let jogos = await fetchJogos();

    const contagemPorCategoria = {};
    for (const j of jogos) {
      const cat = j.competicoes?.categoria || "(sem categoria)";
      contagemPorCategoria[cat] = (contagemPorCategoria[cat] || 0) + 1;
    }
    console.log(`🔍 Ticker debug: ${jogos.length} jogo(s) buscado(s) no total, jogos por categoria:`, contagemPorCategoria);

    if (CATEGORIA_FILTRO) {
      jogos = jogos.filter((j) => (j.competicoes?.categoria || "").trim().toUpperCase() === CATEGORIA_FILTRO);
      console.log(`🔍 Ticker debug: depois do filtro "${CATEGORIA_FILTRO}", sobraram ${jogos.length} jogo(s)`);
    }
    if (jogos.length === 0) {
      document.getElementById("trilho").innerHTML = '<div id="vazio">Nenhum resultado no momento</div>';
      return;
    }

    // ordena por categoria (menor pro maior), depois por horário dentro da mesma categoria
    jogos.sort((a, b) => numeroCategoria(a) - numeroCategoria(b) || String(a.horario).localeCompare(String(b.horario)));
    console.log("🔍 Ticker debug: sequência final, na ordem que vai aparecer na tela:",
      jogos.map((j) => j.competicoes?.categoria || "?"));

    const idsTimes = [...new Set(jogos.flatMap((j) => [j.time_mandante_id, j.time_visitante_id]))];
    const nomes = await fetchTimesNomes(idsTimes);

    const itensHTML = jogos.map((j) => montarItemHTML(j, nomes)).join("");
    // duplica o conteúdo pra criar o loop contínuo sem salto visível
    pista.innerHTML = itensHTML + itensHTML;
    aplicarVelocidade();
  } catch (err) {
    console.error(err);
    document.getElementById("trilho").innerHTML = `<div id="vazio">Erro ao carregar resultados: ${err.message}</div>`;
  }
}

montarTicker();

let _resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { aplicarEscalaFaixa(); aplicarVelocidade(); }, 150);
});

if (REFRESH_SEGUNDOS > 0) {
  let _refreshPendente = false;
  setTimeout(() => { _refreshPendente = true; }, REFRESH_SEGUNDOS * 1000);
  // "animationiteration" dispara toda vez que a rolagem completa uma volta
  // inteira (ela roda em loop infinito) — só recarrega nesse instante, pra
  // nunca cortar a exibição no meio de uma categoria.
  document.getElementById("pista").addEventListener("animationiteration", () => {
    if (_refreshPendente) location.reload();
  });
}
</script>

</body>
</html>
