<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ficha de Transmissão — Arena Futsal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,700;0,800;1,500;1,700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root {
    --cor-fundo-template: #02081a;
    --cor-amarelo: #ffbf00;
    --cor-branco: #ffffff;
    --cor-vermelho: #e65050;
    --cor-verde: #3cc878;
    --cor-cinza: #96a0b4;
    --escala-base: 1; /* recalculado via JS = largura real do #card / 1536 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; font-family: 'Poppins', sans-serif; color: var(--cor-branco); }
  body.fundo-solido { background: #0a1020; }
  #card {
    position: relative; width: min(100vw, 1536px); aspect-ratio: 1536 / 1024; margin: 0 auto;
    background-image: url('template_ficha_transmissao_arena_futsal.png');
    background-size: 100% 100%; overflow: hidden;
  }
  .abs { position: absolute; }
  #logo-transmissao { left: 0.5%; top: 0.5%; width: 24%; height: 11%; display: flex; align-items: center; justify-content: center; }
  #logo-transmissao img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .header-valor {
    top: 4.5%; height: 5.5%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-weight: 700; letter-spacing: 1px;
    font-size: calc(28px * var(--escala-base));
    text-transform: uppercase; color: var(--cor-branco); padding: 0 4px; text-align: center;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  #valor-torneio   { left: 27%; width: 18%; }
  #valor-divisao   { left: 46%; width: 8%; }
  #valor-categoria { left: 55%; width: 16%; }
  .logo-time { top: 21%; width: 15.6%; height: 20.5%; display: flex; align-items: center; justify-content: center; }
  .logo-time img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #logo-a { left: 3.6%; }
  #logo-b { left: 80.8%; }
  .barra-nome {
    top: 43%; width: 15.63%; height: 5.6%;
    display: flex; align-items: center; justify-content: center;
    text-align: center; line-height: 1.15; padding: 0 4px;
  }
  #barra-a { left: 4.56%; }
  #barra-b { left: 79.82%; }
  .barra-nome .nome { font-weight: 800; font-size: calc(19px * var(--escala-base)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #barra-a .nome { color: var(--cor-amarelo); }
  #barra-b .nome { color: var(--cor-branco); }
  .situacao-time { top: 51.5%; width: 15.63%; text-align: center; }
  #situacao-a { left: 4.56%; }
  #situacao-b { left: 79.82%; }
  .situacao-time .pos { font-size: calc(18px * var(--escala-base)); font-weight: 600; color: #d8dfec; margin-bottom: 16px; }
  .situacao-time .badge span { display: inline-block; padding: 3px 12px; border-radius: 999px; font-weight: 800; font-size: calc(14px * var(--escala-base)); text-transform: uppercase; white-space: nowrap; }
  .badge-ouro { background: var(--cor-amarelo); color: #0a0f1f; }
  .badge-prata { background: #c0c8d6; color: #0a0f1f; }
  .badge-naoclassificado { background: #3c465c; color: var(--cor-branco); }
  #centro { left: 20%; top: 21%; width: 60%; }
  .secao-titulo { text-align: center; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--cor-amarelo); font-size: calc(16px * var(--escala-base)); margin: 0.6em 0 0.4em; }
  .secao-titulo.cinza { color: var(--cor-cinza); font-size: calc(20px * var(--escala-base)); }
  .prob-linha { display: flex; align-items: center; gap: calc(14px * var(--escala-base)); }
  .prob-valor { font-weight: 800; font-size: calc(46px * var(--escala-base)); min-width: calc(84px * var(--escala-base)); }
  .prob-valor.a { color: var(--cor-amarelo); text-align: right; }
  .prob-valor.b { color: var(--cor-vermelho); text-align: left; }
  .prob-barra { flex: 1; height: calc(18px * var(--escala-base)); border-radius: 999px; background: #1a2e5a; overflow: hidden; display: flex; }
  .prob-barra .a { background: var(--cor-amarelo); }
  .prob-barra .b { background: var(--cor-vermelho); }
  .favorito { text-align: center; font-style: italic; font-weight: 700; font-size: calc(19px * var(--escala-base)); margin-top: 0.35em; }
  .comp-linha { margin-bottom: calc(9px * var(--escala-base)); }
  .comp-label { text-align: center; font-size: calc(15px * var(--escala-base)); font-weight: 500; color: #c3cbdb; text-transform: uppercase; margin-bottom: 3px; }
  .comp-valores { display: flex; align-items: center; gap: calc(12px * var(--escala-base)); }
  .comp-valor { font-weight: 800; font-size: calc(19px * var(--escala-base)); min-width: calc(36px * var(--escala-base)); }
  .comp-valor.a { color: var(--cor-verde); text-align: right; }
  .comp-valor.b { color: var(--cor-branco); text-align: left; }
  .comp-barra { flex: 1; height: calc(11px * var(--escala-base)); border-radius: 999px; background: #1a2e5a; overflow: hidden; display: flex; }
  .comp-barra .a { background: var(--cor-verde); }
  .comp-barra .b { background: #7c8698; }
  #disciplina .comp-valor.a { color: var(--cor-amarelo); }
  #disciplina .comp-barra .a { background: var(--cor-amarelo); }

  /* ---- Destaques + Forma, agora dentro do espaço de cada time ---- */
  .extra-time { top: 60%; width: 17%; text-align: center; }
  #extra-a { left: 3.8%; }
  #extra-b { left: 79.2%; }
  .extra-time .mini-titulo {
    font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--cor-amarelo);
    font-size: calc(12px * var(--escala-base)); margin: 0.8em 0 0.35em;
  }
  #titulo-forma-a, #titulo-forma-b { margin-top: 1.4em; }
  .extra-destaques .destaque-linha { display: flex; justify-content: space-between; gap: 4px; font-size: calc(12px * var(--escala-base)); text-align: left; }
  .extra-destaques .destaque-linha .nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .extra-destaques .destaque-linha .gols { color: var(--cor-amarelo); font-weight: 700; white-space: nowrap; }
  .extra-forma { display: flex; align-items: center; justify-content: center; gap: calc(6px * var(--escala-base)); }
  .forma-bolinha {
    width: calc(22px * var(--escala-base)); height: calc(22px * var(--escala-base)); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: calc(11px * var(--escala-base)); color: #0a0f1f;
  }
  .forma-v { background: var(--cor-verde); }
  .forma-e { background: #b8c0d0; }
  .forma-d { background: var(--cor-vermelho); color: var(--cor-branco); }
  #baixar-btn { display: block; margin: 14px auto 0; padding: 8px 20px; background: var(--cor-amarelo); color: #0a0f1f; border: none; border-radius: 8px; font-family: 'Poppins', sans-serif; font-weight: 800; cursor: pointer; }
  body.modo-overlay #baixar-btn { display: none; }
  #erro { color: var(--cor-vermelho); text-align: center; padding: 24px; font-size: 14px; background: rgba(0,0,0,0.7); }
</style>
</head>
<body>

<div id="card">
  <div class="abs" id="logo-transmissao"><img id="logo-transmissao-img" src="" alt="" style="display:none;" onerror="this.style.display='none'" /></div>

  <div class="abs header-valor" id="valor-torneio">—</div>
  <div class="abs header-valor" id="valor-divisao">—</div>
  <div class="abs header-valor" id="valor-categoria">—</div>

  <div class="abs logo-time" id="logo-a"><img src="" alt="" style="display:none;" onerror="this.style.display='none'" /></div>
  <div class="abs logo-time" id="logo-b"><img src="" alt="" style="display:none;" onerror="this.style.display='none'" /></div>

  <div class="abs barra-nome" id="barra-a">
    <div class="nome" id="nome-a">—</div>
  </div>

    <div class="pos" id="pos-a">—</div>

  <div class="abs situacao-time" id="situacao-b">
    <div class="pos" id="pos-b">—</div>
    <div class="badge" id="badge-b"></div>
  </div>

  <div class="abs extra-time" id="extra-a">
    <div class="mini-titulo" id="titulo-destaques-a" style="display:none;">Destaques</div>

    <div class="mini-titulo" id="titulo-forma-a" style="display:none;">Últimos 5 Jogos</div>

  </div>
  <div class="abs extra-time" id="extra-b">
    <div class="mini-titulo" id="titulo-destaques-b" style="display:none;">Destaques</div>
    <div class="extra-destaques" id="destaques-b"></div>
    <div class="mini-titulo" id="titulo-forma-b" style="display:none;">Últimos 5 Jogos</div>

  </div>

  <div class="abs" id="centro">
    <div class="secao-titulo cinza">Probabilidade de Vitória</div>
    <div class="prob-linha">
      <div class="prob-valor a" id="prob-a">—</div>
      <div class="prob-barra"><div class="a" id="prob-barra-a"></div><div class="b" id="prob-barra-b"></div></div>
      <div class="prob-valor b" id="prob-b">—</div>
    </div>
    <div class="favorito" id="txt-favorito"></div>

    <div class="secao-titulo">Comparativo Estatístico</div>

    <div class="secao-titulo">Disciplina</div>
    <div id="disciplina"></div>
  </div>
</div>

<button id="baixar-btn" onclick="baixarComoImagem()">⬇ Baixar como imagem</button>

<script>
const SUPABASE_URL = "https://tijoqfkjabapbanpsuqd.supabase.co";
const SUPABASE_KEY = "sb_publishable_4Cl2yym3lTvWWh1A-mRIFQ_Uk3B5vgP";
const LOGOS_BUCKET = "logos";

const params = new URLSearchParams(location.search);
const JOGO_ID = params.get("jogo_id");
const TORNEIO_PARAM = params.get("torneio");
const LOGO_TRANSMISSAO = params.get("transmissao");
const REFRESH_SEGUNDOS = Number(params.get("refresh") || 0);
if (params.get("modo") === "overlay") document.body.classList.add("modo-overlay");
if (params.get("fundo") === "solido") document.body.classList.add("fundo-solido");

function logoTransmissaoUrl(arquivo) {
  return `${SUPABASE_URL}/storage/v1/object/public/${LOGOS_BUCKET}/transmissao/${arquivo}`;
}

let _cacheListaLogosTimes = null;

function normalizarNomeArquivo(txt) {
  return txt.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

async function listarLogosTimes() {
  if (_cacheListaLogosTimes !== null) return _cacheListaLogosTimes;
  try {
    const resp = await fetch(`${SUPABASE_URL}/storage/v1/object/list/${LOGOS_BUCKET}`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify({ prefix: "times/", limit: 1000 }),
    });
    if (!resp.ok) throw new Error(`list falhou (${resp.status})`);
    const dados = await resp.json();
    _cacheListaLogosTimes = dados.map((f) => f.name).filter((n) => n && !n.endsWith("/"));
  } catch (e) {
    console.error("Não consegui listar logos de times:", e);
    _cacheListaLogosTimes = [];
  }
  return _cacheListaLogosTimes;
}

async function logoTimeUrlPorNome(nomeTime) {
  const arquivos = await listarLogosTimes();
  const nomeNorm = normalizarNomeArquivo(nomeTime);
  for (const arq of arquivos) {
    const semExt = arq.replace(/\.[^/.]+$/, "");
    const arqNorm = normalizarNomeArquivo(semExt);
    if (arqNorm.startsWith(nomeNorm) || nomeNorm.startsWith(arqNorm)) {
      return `${SUPABASE_URL}/storage/v1/object/public/${LOGOS_BUCKET}/times/${arq}`;
    }
  }
  return null;
}

async function fetchJSON(url) {
  const resp = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!resp.ok) throw new Error(`Falha ao buscar ${url} (${resp.status})`);
  return resp.json();
}

async function fetchJogo(jogoId) {
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/jogos?select=id,competicao_id,time_mandante_id,time_visitante_id,data&id=eq.${jogoId}`);
  return rows[0] || null;
}
async function fetchCompeticao(competicaoId) {
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/competicoes?select=nome_competicao,divisao,categoria&id=eq.${competicaoId}`);
  return rows[0] || null;
}
async function fetchTimesNomes(ids) {
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/times?select=id,nome_app&id=in.(${ids.join(",")})`);
  const mapa = {};
  rows.forEach((r) => (mapa[r.id] = r.nome_app));
  return mapa;
}
async function fetchClassificacao(competicaoId) {
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/classificacao?select=time_id,pontos,jogos,vitorias,empates,derrotas,gols_pro,gols_contra&competicao_id=eq.${competicaoId}`);
  const porTime = {};
  for (const r of rows) {
    const acc = porTime[r.time_id] || (porTime[r.time_id] = { time_id: r.time_id, pontos: 0, jogos: 0, vitorias: 0, empates: 0, derrotas: 0, gols_pro: 0, gols_contra: 0 });
    acc.pontos += Number(r.pontos) || 0;
    acc.jogos += Number(r.jogos) || 0;
    acc.vitorias += Number(r.vitorias) || 0;
    acc.empates += Number(r.empates) || 0;
    acc.derrotas += Number(r.derrotas) || 0;
    acc.gols_pro += Number(r.gols_pro) || 0;
    acc.gols_contra += Number(r.gols_contra) || 0;
  }
  const lista = Object.values(porTime);
  lista.forEach((t) => (t.saldo_gols = t.gols_pro - t.gols_contra));
  lista.sort((a, b) => b.pontos - a.pontos || b.vitorias - a.vitorias || b.saldo_gols - a.saldo_gols || b.gols_pro - a.gols_pro);
  lista.forEach((t, i) => (t.posicao = i + 1));
  return lista;
}
async function fetchUltimosJogos(competicaoId, timeId, limite = 5) {
  const rows = await fetchJSON(
    `${SUPABASE_URL}/rest/v1/jogos?select=gols_mandante,gols_visitante,time_mandante_id,time_visitante_id,data` +
    `&competicao_id=eq.${competicaoId}&status=eq.FINALIZADO` +
    `&or=(time_mandante_id.eq.${timeId},time_visitante_id.eq.${timeId})` +
    `&order=data.desc&limit=${limite}`
  );
  const resultados = rows.map((j) => {
    const ehMandante = j.time_mandante_id == timeId;
    const golsPro = ehMandante ? j.gols_mandante : j.gols_visitante;
    const golsContra = ehMandante ? j.gols_visitante : j.gols_mandante;
    if (golsPro > golsContra) return "V";
    if (golsPro === golsContra) return "E";
    return "D";
  });
  return resultados.reverse(); // mais antigo → mais recente, esquerda pra direita
}

async function fetchArtilheiros(competicaoId, timeId, limite = 3) {
  const rows = await fetchJSON(`${SUPABASE_URL}/rest/v1/atleta_stats?select=gols,atletas(nome)&competicao_id=eq.${competicaoId}&time_id=eq.${timeId}&order=gols.desc&limit=${limite}`);
  return rows.filter((r) => r.atletas && r.gols > 0).map((r) => ({ nome: r.atletas.nome, gols: r.gols }));
}
async function fetchFaltas(competicaoId, timeId) {
  // Jogos do time nessa competição, pra saber quem foi o adversário em cada um
  const jogos = await fetchJSON(
    `${SUPABASE_URL}/rest/v1/jogos?select=id,time_mandante_id,time_visitante_id` +
    `&competicao_id=eq.${competicaoId}&or=(time_mandante_id.eq.${timeId},time_visitante_id.eq.${timeId})`
  );
  if (jogos.length === 0) return { cometidas: 0, sofridas: 0 };

  const jogoIds = jogos.map((j) => j.id);
  const oponentePorJogo = {};
  jogos.forEach((j) => {
    oponentePorJogo[j.id] = j.time_mandante_id == timeId ? j.time_visitante_id : j.time_mandante_id;
  });

  // sumula_eventos.time_id = quem COMETEU a falta (mesma lógica do raio_x_app.py)
  const eventos = await fetchJSON(
    `${SUPABASE_URL}/rest/v1/sumula_eventos?select=jogo_id,time_id&tipo=eq.falta&jogo_id=in.(${jogoIds.join(",")})`
  );

  let cometidas = 0, sofridas = 0;
  for (const ev of eventos) {
    if (ev.time_id == timeId) cometidas++;
    else if (ev.time_id == oponentePorJogo[ev.jogo_id]) sofridas++;
  }
  return { cometidas, sofridas };
}

async function fetchDisciplina(competicaoId, timeId) {
  try {
    const [rowsCartoes, faltas] = await Promise.all([
      fetchJSON(
        `${SUPABASE_URL}/rest/v1/sumula_atletas?select=amarelo,vermelho,jogos!inner(competicao_id)&time_id=eq.${timeId}&jogos.competicao_id=eq.${competicaoId}`
      ),
      fetchFaltas(competicaoId, timeId),
    ]);
    let amarelos = 0, vermelhos = 0;
    for (const r of rowsCartoes) {
      if (r.amarelo) amarelos++;
      if (r.vermelho) vermelhos++;
    }
    return { amarelos, vermelhos, faltasCometidas: faltas.cometidas, faltasSofridas: faltas.sofridas };
  } catch (e) {
    console.error("Erro ao buscar disciplina:", e);
    return { amarelos: 0, vermelhos: 0, faltasCometidas: 0, faltasSofridas: 0 };
  }
}

function calcularFaixas(totalTimes) {
  if (totalTimes <= 0) return { ouro: 0, prata_fim: 0 };
  return { ouro: Math.min(8, totalTimes), prata_fim: Math.min(16, totalTimes) };
}
function montarMetas(lista) {
  const faixas = calcularFaixas(lista.length);
  const porTimeId = {};
  lista.forEach((t) => {
    let tipo;
    if (t.posicao <= faixas.ouro) tipo = "Ouro";
    else if (t.posicao <= faixas.prata_fim) tipo = "Prata";
    else tipo = "Não Classificado";
    porTimeId[t.time_id] = { tipo };
  });
  return porTimeId;
}
function calcForca(jogos, golsPro, golsContra, vitorias) {
  const n = jogos > 0 ? jogos : 1;
  return Math.max((golsPro / n) * 1.8 + vitorias * 0.3 - (golsContra / n) * 0.8, 0.1);
}

function classeBadge(tipo) {
  if (tipo === "Ouro") return "badge-ouro";
  if (tipo === "Prata") return "badge-prata";
  return "badge-naoclassificado";
}

function montarComparativo(ca, cb) {
  const aprovA = Math.round((ca.pontos / Math.max(ca.jogos * 3, 1)) * 1000) / 10;
  const aprovB = Math.round((cb.pontos / Math.max(cb.jogos * 3, 1)) * 1000) / 10;
  const linhas = [
    ["Aproveitamento %", aprovA, aprovB, (v) => v.toFixed(1)],
    ["Vitórias", ca.vitorias, cb.vitorias, (v) => v],
    ["Gols Marcados", ca.gols_pro, cb.gols_pro, (v) => v],
    ["Gols Sofridos", ca.gols_contra, cb.gols_contra, (v) => v],
  ];
  const container = document.getElementById("comparativo");
  container.innerHTML = "";
  for (const [label, va, vb, fmt] of linhas) {
    const total = Math.max(va + vb, 0.0001);
    const fracA = (va / total) * 100;
    const div = document.createElement("div");
    div.className = "comp-linha";
    div.innerHTML = `
      <div class="comp-label">${label}</div>
      <div class="comp-valores">
        <div class="comp-valor a">${fmt(va)}</div>
        <div class="comp-barra"><div class="a" style="width:${fracA}%"></div><div class="b" style="width:${100 - fracA}%"></div></div>
        <div class="comp-valor b">${fmt(vb)}</div>
      </div>`;
    container.appendChild(div);
  }
}

function montarDisciplina(discA, discB) {
  const linhas = [
    ["Faltas Cometidas", discA.faltasCometidas, discB.faltasCometidas],
    ["Faltas Sofridas", discA.faltasSofridas, discB.faltasSofridas],
    ["Cartões Amarelos", discA.amarelos, discB.amarelos],
    ["Cartões Vermelhos", discA.vermelhos, discB.vermelhos],
  ];
  const container = document.getElementById("disciplina");
  container.innerHTML = "";
  for (const [label, va, vb] of linhas) {
    const total = Math.max(va + vb, 0.0001);
    const fracA = (va / total) * 100;
    const div = document.createElement("div");
    div.className = "comp-linha";
    div.innerHTML = `
      <div class="comp-label">${label}</div>
      <div class="comp-valores">
        <div class="comp-valor a">${va}</div>
        <div class="comp-barra"><div class="a" style="width:${fracA}%"></div><div class="b" style="width:${100 - fracA}%"></div></div>
        <div class="comp-valor b">${vb}</div>
      </div>`;
    container.appendChild(div);
  }
}

function montarDestaquesTime(lado, artilheiros) {
  const container = document.getElementById(`destaques-${lado}`);
  container.innerHTML = "";
  if (artilheiros.length === 0) return;
  document.getElementById(`titulo-destaques-${lado}`).style.display = "block";
  for (const item of artilheiros) {
    const div = document.createElement("div");
    div.className = "destaque-linha";
    div.innerHTML = `<span class="nome">${item.nome}</span><span class="gols">${item.gols} gol(s)</span>`;
    container.appendChild(div);
  }
}

function montarFormaTime(lado, forma) {
  const container = document.getElementById(`forma-${lado}`);
  container.innerHTML = "";
  if (forma.length === 0) return;
  document.getElementById(`titulo-forma-${lado}`).style.display = "block";
  for (const r of forma) {
    const bolinha = document.createElement("div");
    bolinha.className = `forma-bolinha forma-${r.toLowerCase()}`;
    bolinha.textContent = r;
    container.appendChild(bolinha);
  }
}

function aplicarEscalaBase() {
  const card = document.getElementById("card");
  const escala = card.clientWidth / 1536; // 1536 = largura de design do template
  document.documentElement.style.setProperty("--escala-base", escala);
}

async function montarPagina() {
  aplicarEscalaBase();
  if (LOGO_TRANSMISSAO) {
    const img = document.getElementById("logo-transmissao-img");
    img.src = logoTransmissaoUrl(LOGO_TRANSMISSAO);
    img.style.display = "block";
  }

  if (!JOGO_ID) {
    document.getElementById("card").insertAdjacentHTML("beforeend", '<div id="erro" class="abs" style="left:0;top:0;width:100%;height:100%;">Faltou o parâmetro ?jogo_id= na URL.</div>');
    return;
  }

  const jogo = await fetchJogo(JOGO_ID);
  if (!jogo) {
    document.getElementById("card").insertAdjacentHTML("beforeend", '<div id="erro" class="abs" style="left:0;top:0;width:100%;height:100%;">Jogo não encontrado.</div>');
    return;
  }

  const [competicao, nomes] = await Promise.all([
    fetchCompeticao(jogo.competicao_id),
    fetchTimesNomes([jogo.time_mandante_id, jogo.time_visitante_id]),
  ]);

  const nomeA = nomes[jogo.time_mandante_id] || "—";
  const nomeB = nomes[jogo.time_visitante_id] || "—";

  document.getElementById("valor-torneio").textContent = (TORNEIO_PARAM || competicao?.nome_competicao || "—").toUpperCase();
  document.getElementById("valor-divisao").textContent = (competicao?.divisao || "—").toUpperCase();
  document.getElementById("valor-categoria").textContent = (competicao?.categoria || "—").toUpperCase();

  document.getElementById("nome-a").textContent = nomeA;
  document.getElementById("nome-b").textContent = nomeB;

  const [logoUrlA, logoUrlB] = await Promise.all([logoTimeUrlPorNome(nomeA), logoTimeUrlPorNome(nomeB)]);
  if (logoUrlA) { const img = document.querySelector("#logo-a img"); img.src = logoUrlA; img.style.display = "block"; }
  if (logoUrlB) { const img = document.querySelector("#logo-b img"); img.src = logoUrlB; img.style.display = "block"; }

  const classificacao = await fetchClassificacao(jogo.competicao_id);
  const ca = classificacao.find((t) => t.time_id == jogo.time_mandante_id);
  const cb = classificacao.find((t) => t.time_id == jogo.time_visitante_id);
  if (!ca || !cb) {
    document.getElementById("card").insertAdjacentHTML("beforeend", '<div id="erro" class="abs" style="left:0;top:0;width:100%;height:100%;">Sem classificação suficiente pra essa competição ainda.</div>');
    return;
  }

  document.getElementById("pos-a").textContent = `${ca.posicao}º colocado - ${ca.pontos} pontos`;
  document.getElementById("pos-b").textContent = `${cb.posicao}º colocado - ${cb.pontos} pontos`;

  const metas = montarMetas(classificacao);
  const metaA = metas[jogo.time_mandante_id];
  const metaB = metas[jogo.time_visitante_id];
  if (metaA) document.getElementById("badge-a").innerHTML = `<span class="${classeBadge(metaA.tipo)}">${metaA.tipo}</span>`;
  if (metaB) document.getElementById("badge-b").innerHTML = `<span class="${classeBadge(metaB.tipo)}">${metaB.tipo}</span>`;

  const forcaA = calcForca(ca.jogos, ca.gols_pro, ca.gols_contra, ca.vitorias);
  const forcaB = calcForca(cb.jogos, cb.gols_pro, cb.gols_contra, cb.vitorias);
  const probA = Math.round((forcaA / (forcaA + forcaB)) * 100);
  const probB = 100 - probA;
  document.getElementById("prob-a").textContent = `${probA}%`;
  document.getElementById("prob-b").textContent = `${probB}%`;
  document.getElementById("prob-barra-a").style.width = `${probA}%`;
  document.getElementById("prob-barra-b").style.width = `${probB}%`;
  if (probA !== probB) {
    const favorito = probA > probB ? nomeA : nomeB;
    const fav = document.getElementById("txt-favorito");
    fav.textContent = `Favorito: ${favorito.toUpperCase()}`;
    fav.style.color = probA > probB ? "var(--cor-amarelo)" : "var(--cor-vermelho)";
  }

  montarComparativo(ca, cb);

  const [discA, discB] = await Promise.all([
    fetchDisciplina(jogo.competicao_id, jogo.time_mandante_id),
    fetchDisciplina(jogo.competicao_id, jogo.time_visitante_id),
  ]);
  montarDisciplina(discA, discB);

  const [artA, artB] = await Promise.all([
    fetchArtilheiros(jogo.competicao_id, jogo.time_mandante_id),
    fetchArtilheiros(jogo.competicao_id, jogo.time_visitante_id),
  ]);
  montarDestaquesTime("a", artA);
  montarDestaquesTime("b", artB);

  const [formaA, formaB] = await Promise.all([
    fetchUltimosJogos(jogo.competicao_id, jogo.time_mandante_id),
    fetchUltimosJogos(jogo.competicao_id, jogo.time_visitante_id),
  ]);
  montarFormaTime("a", formaA);
  montarFormaTime("b", formaB);

  ajustarEscalaCentro();
}

function ajustarEscalaCentro() {
  const centro = document.getElementById("centro");
  const card = document.getElementById("card");
  centro.style.transform = "none"; // mede sem escala aplicada primeiro
  const cardRect = card.getBoundingClientRect();
  const centroRect = centro.getBoundingClientRect();
  const limiteInferior = cardRect.top + cardRect.height * 0.72; // até pouco antes da quadra/rodapé
  const disponivel = limiteInferior - centroRect.top;
  const necessario = centroRect.height;
  if (necessario > disponivel && disponivel > 0) {
    const escala = Math.max(disponivel / necessario, 0.55);
    centro.style.transform = `scale(${escala})`;
    centro.style.transformOrigin = "top center";
  }
}

function baixarComoImagem() {
  const btn = document.getElementById("baixar-btn");
  btn.style.display = "none";
  html2canvas(document.getElementById("card"), { backgroundColor: null, scale: 2, useCORS: true }).then((canvas) => {
    btn.style.display = "block";
    const link = document.createElement("a");
    link.download = "ficha_transmissao.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}

montarPagina().catch((err) => {
  console.error(err);
  document.getElementById("card").insertAdjacentHTML("beforeend", `<div id="erro" class="abs" style="left:0;top:0;width:100%;height:100%;">Erro ao carregar dados: ${err.message}</div>`);
});

let _resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => {
    aplicarEscalaBase();
    ajustarEscalaCentro();
  }, 150);
});

if (REFRESH_SEGUNDOS > 0) {
  setInterval(() => location.reload(), REFRESH_SEGUNDOS * 1000);
}
</script>
